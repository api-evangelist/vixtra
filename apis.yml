name: Vixtra
description: 'Vixtra (VIXTRA Tecnologia e Serviços Financeiros LTDA., CNPJ 43.443.444/0001-04)
  is a Brazilian trade-finance fintech founded in July 2021 and headquartered in São
  Paulo, positioning itself as "the Trade Banking of the Brazilian importer." It pioneers
  financing for importers using in-transit maritime cargo as collateral, and delivers
  credit, foreign exchange, guarantees, and cash-flow management for foreign trade
  from a single digital platform. Its products include Crédito Flex (revolving working-capital
  credit), Crédito Pré (pre-shipment import financing), Câmbio Fácil (100% digital
  commercial FX), Trade Banking (the unified operations platform), and a Vixtra stablecoin
  for cross-border payments. Vixtra operates as a banking correspondent of BMP Money
  Plus SCD and an FX correspondent of Ebury Banco de Câmbio, has raised roughly US$36M
  (US$30M debt + US$6M seed extension) led by QED Investors with Valor Capital Group,
  Endeavor Promessas, NXTP Ventures, Actyus, and BluStone, and processes data in compliance
  with Brazil''s LGPD. No public developer portal or API is currently published; the
  api.vixtra.com host backs the customer application and returns 403 to anonymous callers.'
